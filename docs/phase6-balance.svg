<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490"><title>Phase 6 measured policy outcomes</title><rect width="1000" height="490" fill="#10272b"/><g font-family="Arial,sans-serif" fill="#edf1e6"><text x="35" y="40" font-size="24">PHASE 6 — Measured policy outcomes</text><text x="35" y="68" font-size="14">300 matched-seed games per version. Automated policies, not human win rates.</text><text x="650" y="105" fill="#8caeb3">Before</text><text x="760" y="105" fill="#e5c894">After</text><text x="35" y="162" font-size="16">Survivor wins</text><rect x="260" y="145" width="566" height="20" fill="#8caeb3"/><text x="836" y="160" font-size="13">94.33%</text><rect x="260" y="170" width="566" height="20" fill="#e5c894"/><text x="836" y="185" font-size="13">94.33%</text><text x="35" y="240" font-size="16">Human spy wins</text><rect x="260" y="223" width="0" height="20" fill="#8caeb3"/><text x="270" y="238" font-size="13">0.00%</text><rect x="260" y="248" width="54" height="20" fill="#e5c894"/><text x="324" y="263" font-size="13">9.00%</text><text x="35" y="318" font-size="16">Spy exile rate</text><rect x="260" y="301" width="408" height="20" fill="#8caeb3"/><text x="678" y="316" font-size="13">68.00%</text><rect x="260" y="326" width="386" height="20" fill="#e5c894"/><text x="656" y="341" font-size="13">64.33%</text><text x="35" y="396" font-size="16">Unsupported AI votes</text><rect x="260" y="379" width="23.776223776223777" height="20" fill="#8caeb3"/><text x="293.7762237762238" y="394" font-size="13">3.96%</text><rect x="260" y="404" width="0" height="20" fill="#e5c894"/><text x="270" y="419" font-size="13">0.00%</text></g></svg>